version: "3.8"

services:
  supabasezombi:
    image: ghcr.io/${GITHUB_USERNAME}/supabasezombi:latest
    # 로컬에서 빌드하려면 위 줄을 주석처리하고 아래 줄 사용:
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    container_name: supabasezombi
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - TZ=Asia/Seoul
      # For custom settings, create docker-compose.override.yml
      # See docker-compose.override.yml.example for template
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"
